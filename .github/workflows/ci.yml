name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # jest includes the guards that make the docs and examples LAW:
      # doc-blocks (every ```ft block in doc/ executes), examples
      # (all runnable examples pass), validate-impl (the PARSE_LEDGER
      # ratchet over the 113-file spec corpus).
      - run: npx jest
      - run: npm run examples
